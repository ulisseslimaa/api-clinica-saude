spring.application.name=clinica

# Carrega variáveis do arquivo .env na raiz do projeto, quando ele existir.
spring.config.import=optional:file:.env[.properties]

# Configuração da conexão JDBC; credenciais são fornecidas pelo ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica_saude_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuração exigida do Hibernate (nenhuma alteração automática de DDL)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none
